<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassy Effect Form</title>
  <style>
    
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, rgba(255, 99, 132, 0.5), rgba(54, 162, 235, 0.5), rgba(255, 159, 64, 0.5));

      backdrop-filter: blur(20px); 
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
    }

    form {
      max-width: 640px; 
      padding: 30px; 
      border-radius: 12px; 
      background: rgba(255, 255, 255, 0.2); 
      backdrop-filter: blur(15px); 
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      width: 100%; 
      color: #fff;
    }

    input, button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      margin-bottom: 18px;
      border: 2px solid #ddd;
      background-color: #fff;
      color: #333;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    input {
      background-color: rgba(255, 255, 255, 0.8);
      
    }

    button {
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    button[type="submit"] {
      background-color: #F2874A;
      color: white;
      font-weight: bold;
    }

    button[type="button"] {
      background-color: #f44336;
      color: white;
      font-weight: bold;
    }

    button:hover {
      transform: scale(1.05);
    }

    /* Label style */
    label {
      font-size: 18px;
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      color: #fff;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      form {
        padding: 30px;
      }

      input, button {
        padding: 12px;
        font-size: 14px;
      }
    }

    /* Focus Effect */
    input:focus, button:focus {
      border-color: #F2874A;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Form with glassy background -->
  <form [formGroup]="companyForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 20px;">
      <label for="name">Company Name📝👤</label>
      <input id="name" formControlName="name" placeholder="Enter company name">
    </div>

    <div style="margin-bottom: 20px;">
      <label for="location">Location📍🌍</label>
      <input id="location" formControlName="location" placeholder="Enter company location">
    </div>

    <div style="margin-bottom: 20px;">
      <label for="employee_count">Employee count 🆔🏷️</label>
      <input id="employee_count" formControlName="employee_count" type="number" placeholder="Employee count">
    </div>

    <div style="margin-bottom: 20px;">
      <label for="founded_year">Founded Year📅🗓️</label>
      <input id="founded_year" formControlName="founded_year" placeholder="Enter Founded Year">
    </div>

    <div style="margin-bottom: 30px;">
      <label for="industry">Industry Name🏢🏭</label>
      <input id="industry" formControlName="industry" placeholder="Enter Industry name">
    </div>

    <div style="text-align: center;">
      <button type="submit">{{ isEditMode ? 'Update' : 'Submit' }}</button>
      <button type="button" (click)="onDelete()" *ngIf="isEditMode">Delete</button>
    </div>
  </form>

</body>
</html>
