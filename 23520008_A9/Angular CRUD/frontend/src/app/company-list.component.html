<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Table</title>
  <style>
    /* Gradient background for the page */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, rgba(255, 99, 132, 0.5), rgba(54, 162, 235, 0.5), rgba(255, 159, 64, 0.5));
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Table styling */
    table {
      width: 80%; /* Adjusted table width */
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.2); /* Semi-transparent white */
      backdrop-filter: blur(10px); /* Glassy effect */
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
      color: #333;
    }

    th {
      background-color: rgba(242, 242, 242, 0.8);
      font-size: 16px;
    }

    /* Row hover effect */
    tr:hover {
      background-color: rgba(242, 242, 242, 0.6);
      cursor: pointer;
    }

    /* Action buttons styling */
    button {
      padding: 8px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.3s;
    }

    .edit-button {
      background-color: #F2874A;
      color: white;
      margin-right: 8px;
    }

    .delete-button {
      background-color: #f44336;
      color: white;
    }

    button:hover {
      transform: scale(1.05);
    }

    /* Form container styling */
    .form-container {
      width: 80%;
      max-width: 800px;
      margin-top: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      border-top: 1px solid #ddd;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    h3 {
      font-size: 34px;
      font-weight: bold;
      color: #333;
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 2px solid #ccc;
      background-color: #fff;
      color: #333;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    button[type="submit"] {
      background-color: #F2874A;
      color: white;
    }

    button[type="button"] {
      background-color: #f44336;
      color: white;
    }

    label {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>Company Name</th>
        <th>Location</th>
        <th>Employee Count</th>
        <th>Founded Year</th>
        <th>Industry Name</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let company of companies">
        <td>{{ company.name }}</td>
        <td>{{ company.location }}</td>
        <td>{{ company.employee_count }}</td>
        <td>{{ company.founded_year }}</td>
        <td>{{ company.industry }}</td>
        <td>
          <button class="edit-button" (click)="onEdit(company)">Edit</button>
          <button class="delete-button" (click)="onDelete(company)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Company form displayed below the table when selected -->
  <div *ngIf="selectedCompany" class="form-container">
    <h3>Update Records</h3>
    <app-company-form [company]="selectedCompany" (companyUpdated)="onCompanyUpdated($event)">
    </app-company-form>
  </div>

</body>
</html>
